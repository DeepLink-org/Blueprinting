[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "blueprinting"
dynamic = ["version"]
description = "A simulation and analysis toolkit for heterogeneous computing and large-scale distributed training systems"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = [
    "llm",
    "distributed-training",
    "performance-modeling",
    "simulation",
    "deep-learning",
    "gpu",
    "heterogeneous-computing",
    "transformer",
    "parallel-computing",
]
authors = [
    { name = "Reiase", email = "reiase@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "hyperparameter>=0.4.0",
    "fire>=0.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "rich>=12.0.0",
    "sympy>=1.12.1",
    "streamlit>=1.40.1",
    "streamlit-extras>=0.6.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
full = [
    "streamlit>=1.20.0",
    "plotly>=5.0.0",
    "streamlit-extras>=0.3.0",
    "graphviz>=0.20.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "ipdb>=0.13.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "blueprinting[full,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/reiase/blueprinting"
Documentation = "https://github.com/reiase/blueprinting#readme"
Repository = "https://github.com/reiase/blueprinting.git"
Issues = "https://github.com/reiase/blueprinting/issues"
Changelog = "https://github.com/reiase/blueprinting/releases"

[project.scripts]
blueprinting = "blueprinting:__main__"

# ============================================================================
# Hatch Configuration
# ============================================================================

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.hooks.vcs]
version-file = "src/blueprinting/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data",
    "/tests",
]
exclude = [
    "/.github",
    "/docs",
    "/examples",
    "/pages",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blueprinting", "src/calculon", "src/simfloat"]

[tool.hatch.envs.default]
features = ["dev", "full"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=blueprinting --cov-report=term-missing {args:tests}"
lint = "ruff check src/ tests/"
fmt = "ruff format src/ tests/"

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build"
serve = "mkdocs serve"

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
line-length = 120
target-version = "py38"
src = ["src", "tests"]
exclude = [
    "src/calculon/*",
    "scripts/*",
    ".git",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip strict
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["blueprinting", "calculon", "simfloat"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"__init__.py" = ["F401"]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--doctest-modules",
    "--durations=10",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source_pkgs = ["blueprinting"]
branch = true
parallel = true
omit = [
    "src/blueprinting/__about__.py",
    "src/calculon/*",
]

[tool.coverage.paths]
blueprinting = ["src/blueprinting"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "@abstractmethod",
]
show_missing = true

# ============================================================================
# MyPy Configuration (Optional)
# ============================================================================

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "src/calculon/",
    "tests/",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
