site_name: Blueprinting — Hardware Architecture Exploration
site_description: Evidence-driven hardware architecture exploration and simulation for distributed AI workloads
site_url: https://deeplink-org.github.io/Blueprinting/
repo_url: https://github.com/DeepLink-org/Blueprinting
repo_name: DeepLink-org/Blueprinting
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Blueprinting contributors

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    logo: material/vector-square
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture Exploration:
      - Why Blueprinting: exploration/index.md
      - Hardware Design Space: exploration/design-space.md
      - Exploration Workflow: exploration/workflow.md
      - Exploration Workspace: exploration/workspace.md
  - Models and Simulation:
      - Hardware Architecture Model: modeling/hardware.md
      - Workload and Mapping Model: modeling/workload.md
      - Inference Planning and Serving Simulation: modeling/inference.md
      - Performance Evidence and Cost Models: design/performance/index.md
      - Cost Providers and Data Imports: design/performance/providers.md
      - Performance Database: design/performance/database.md
      - Simulation and Calibration: design/performance/simulation.md
  - Experiments:
      - Calculon Calibration: experiments/calculon-calibration.md
      - Vidur Raw Component-Profile Alignment: experiments/vidur-baseline.md
  - Formal Analysis Foundations:
      - Formal Analysis Architecture: design/index.md
      - Derivation and Verification Model: design/synthesis-model.md
      - Timeline Staging Path: design/timeline-path.md
      - Golden Derivation Walkthrough: design/walkthrough.md
      - Analysis Module Architecture: design/modules.md
      - Floating-Point Numerical Analysis: design/numerical-analysis.md
      - IR Derivation Debugging: design/derivation-debugging.md
      - Progressive Typed Python Contracts: design/typed-python-contracts.md
      - Formal Representations:
          - Representation Stack: design/ir/index.md
          - Python Algebraic IR Authoring: design/ir/python-algebra.md
          - Typed Transformer Parallel Strategies: design/ir/parallel-strategy.md
          - Workload and Distribution Models: design/ir/model-distributed.md
          - Planning and Realization Models: design/ir/planning-execution.md
      - Analysis and Transformation:
          - Transaction Infrastructure: design/passes/index.md
          - Transformer Workload Derivation: design/passes/transformer.md
          - Architecture Binding and Plan Construction: design/passes/target.md
  - Code Reference:
      - Code Documentation: reference/index.md
      - Canonical IR API:
          - ModelIR API: reference/model-ir.md
          - DistributedTaskIR API: reference/distributed-task-ir.md
          - PortablePlanIR API: reference/portable-plan-ir.md
          - ConcretePlanIR API: reference/concrete-plan-ir.md
          - MachineIR API: reference/machine-ir.md
      - Pass Formulae and API: reference/passes.md
      - Derivation Infrastructure API: reference/derivation-infrastructure.md
  - Project:
      - Implementation Status: project/status.md
      - Roadmap: project/roadmap.md
      - Decisions and Terminology: project/decisions.md
      - ADR-0001 — Synthesizer Package: project/adr/0001-synthesizer-package.md
      - ADR-0002 — Workload and System Domains: project/adr/0002-workload-system-domains.md
      - ADR-0003 — Derivation Debug Trace: project/adr/0003-derivation-debug-trace.md
      - ADR-0004 — Semantic Wire Identities: project/adr/0004-semantic-wire-identities.md
      - ADR-0005 — Algebraic Expression and Command Schemas: project/adr/0005-algebraic-expression-command-schemas.md
      - ADR-0006 — Progressive Typed Python Contracts: project/adr/0006-progressive-typed-python-contracts.md
      - Architecture Risk Register: project/risks.md
      - Documentation Guide: contributing/documentation.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_section_style: list
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            skip_local_inventory: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
  - i18n:
      docs_structure: suffix
      # Shared, language-neutral assets are inherited from the default locale.
      # Markdown fallback is guarded separately by scripts/check_docs_i18n.py.
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      build_only_locale: !ENV [BUILD_ONLY_LOCALE]
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: Blueprinting 硬件架构探索
          site_description: 面向分布式 AI 工作负载的证据驱动硬件架构探索与仿真系统
          nav_translations:
            Home: 首页
            Architecture Exploration: 硬件架构探索
            Why Blueprinting: 为什么叫 Blueprinting
