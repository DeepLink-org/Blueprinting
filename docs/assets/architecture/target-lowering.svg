<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">Late target binding to simulation and target program</title>
  <desc id="desc">PortablePlanIR combines with target and deployment profiles, evidence resolution, resource scheduling, memory planning, and typed target extensions to create one ConcretePlanIR envelope used by simulation and MachineIR emission.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#526075"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D67B14"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D7FF9"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168A61"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill:#172033; }
      .title { font-size:34px; font-weight:760; letter-spacing:-0.5px; }
      .subtitle { font-size:16px; fill:#667085; }
      .stage { font-size:13px; font-weight:760; letter-spacing:0.8px; }
      .box-title { font-size:18px; font-weight:730; }
      .box-sub { font-size:12px; fill:#5D687A; }
      .small { font-size:11px; fill:#667085; }
      .pill { font-size:11px; font-weight:720; }
      .arrow { fill:none; stroke:#526075; stroke-width:2.3; marker-end:url(#arrow); }
      .binding { fill:none; stroke:#D67B14; stroke-width:2.7; marker-end:url(#arrowOrange); }
      .derived { fill:none; stroke:#2D7FF9; stroke-width:2.4; marker-end:url(#arrowBlue); }
      .product { fill:none; stroke:#168A61; stroke-width:2.4; marker-end:url(#arrowGreen); }
      .feedback { fill:none; stroke:#8C6BC8; stroke-width:2.1; stroke-dasharray:7 6; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="1020" fill="#F7F9FC"/>
  <text x="52" y="58" class="title">Late Binding → One Concrete Execution Envelope</text>
  <text x="52" y="86" class="subtitle">迟绑定技术路径 · Common coordination + typed target semantics drive simulation and program emission</text>

  <text x="52" y="132" class="stage" fill="#B56B10">1 · BIND &amp; LEGALIZE / 绑定与合法化</text>
  <g filter="url(#shadow)">
    <rect x="52" y="154" width="392" height="96" rx="16" fill="#E6F8FB" stroke="#1E9FB5"/>
    <text x="78" y="188" class="box-title">PortablePlanIR</text>
    <text x="78" y="212" class="box-sub">task DAG · exact workload · abstract buffers/resources</text>
    <text x="78" y="233" class="box-sub">target-neutral digest remains stable</text>
    <rect x="476" y="154" width="300" height="96" rx="16" fill="#FFF3E1" stroke="#E58A20"/>
    <text x="502" y="188" class="box-title">TargetProfile</text>
    <text x="502" y="212" class="box-sub">architecture · runtime · capabilities</text>
    <text x="502" y="233" class="box-sub">kernel/collective library · ABI</text>
    <rect x="808" y="154" width="300" height="96" rx="16" fill="#FFF3E1" stroke="#E58A20"/>
    <text x="834" y="188" class="box-title">DeploymentProfile</text>
    <text x="834" y="212" class="box-sub">device instances · topology · capacity</text>
    <text x="834" y="233" class="box-sub">reservations · environment revision</text>
    <rect x="1140" y="154" width="248" height="96" rx="16" fill="#F4F0FF" stroke="#A79BEA"/>
    <text x="1166" y="188" class="box-title">TargetPlugin</text>
    <text x="1166" y="212" class="box-sub">legality · selector · resource model</text>
    <text x="1166" y="233" class="box-sub">machine lowering · profiler adapter</text>
  </g>

  <rect x="306" y="292" width="828" height="76" rx="16" fill="#FFF3E1" stroke="#E58A20" filter="url(#shadow)"/>
  <text x="720" y="322" text-anchor="middle" class="box-title">Target legalization + implementation selection</text>
  <text x="720" y="346" text-anchor="middle" class="box-sub">capability coverage · ABI/type checks · kernel/collective candidates · typed target extensions</text>
  <path d="M248 250 L420 292" class="binding"/>
  <path d="M626 250 L626 292" class="binding"/>
  <path d="M958 250 L900 292" class="binding"/>
  <path d="M1264 250 L1018 292" class="binding"/>

  <text x="52" y="414" class="stage" fill="#A56F00">2 · RESOLVE EVIDENCE / 解析证据</text>
  <rect x="52" y="438" width="324" height="80" rx="14" fill="#FFF7DB" stroke="#D99A00" filter="url(#shadow)"/>
  <text x="78" y="469" class="box-title">EstimateRequest</text>
  <text x="78" y="493" class="box-sub">workload + implementation + target + concurrency context</text>
  <rect x="412" y="438" width="288" height="80" rx="14" fill="#FFF7DB" stroke="#D99A00" filter="url(#shadow)"/>
  <text x="556" y="469" text-anchor="middle" class="box-title">CostResolver</text>
  <text x="556" y="493" text-anchor="middle" class="box-sub">policy · quality · uncertainty · fallback</text>

  <g filter="url(#shadow)">
    <rect x="744" y="424" width="144" height="94" rx="13" fill="#FFF7DB" stroke="#D99A00"/>
    <text x="816" y="455" text-anchor="middle" class="box-title">Perf DB</text>
    <text x="816" y="479" text-anchor="middle" class="box-sub">measured/interpolated</text>
    <text x="816" y="500" text-anchor="middle" class="box-sub">性能数据库</text>
    <rect x="906" y="424" width="144" height="94" rx="13" fill="#FFF7DB" stroke="#D99A00"/>
    <text x="978" y="455" text-anchor="middle" class="box-title">HW Sim</text>
    <text x="978" y="479" text-anchor="middle" class="box-sub">local/plan fidelity</text>
    <text x="978" y="500" text-anchor="middle" class="box-sub">硬件模拟</text>
    <rect x="1068" y="424" width="144" height="94" rx="13" fill="#FFF7DB" stroke="#D99A00"/>
    <text x="1140" y="455" text-anchor="middle" class="box-title">Net Sim</text>
    <text x="1140" y="479" text-anchor="middle" class="box-sub">route/contention</text>
    <text x="1140" y="500" text-anchor="middle" class="box-sub">网络模拟</text>
    <rect x="1230" y="424" width="158" height="94" rx="13" fill="#FFF7DB" stroke="#D99A00"/>
    <text x="1309" y="455" text-anchor="middle" class="box-title">Analytical</text>
    <text x="1309" y="479" text-anchor="middle" class="box-sub">explicit fallback</text>
    <text x="1309" y="500" text-anchor="middle" class="box-sub">解析模型</text>
  </g>
  <path d="M430 368 L214 438" class="arrow"/>
  <path d="M376 478 L412 478" class="arrow"/>
  <path d="M744 471 L700 471" class="arrow"/>
  <path d="M906 471 L700 471" class="arrow"/>
  <path d="M1068 471 L700 471" class="arrow"/>
  <path d="M1230 471 L700 471" class="arrow"/>

  <rect x="488" y="552" width="464" height="72" rx="16" fill="#EAF3FF" stroke="#2D7FF9" filter="url(#shadow)"/>
  <text x="720" y="581" text-anchor="middle" class="box-title">CostedTaskView</text>
  <text x="720" y="605" text-anchor="middle" class="box-sub">versioned estimates · provenance · intervals · workspace/resources</text>
  <path d="M556 518 L650 552" class="derived"/>

  <text x="52" y="665" class="stage" fill="#B56B10">3 · SCHEDULE &amp; PLAN MEMORY / 资源调度与内存规划</text>
  <rect x="306" y="686" width="828" height="76" rx="16" fill="#FFF3E1" stroke="#E58A20" filter="url(#shadow)"/>
  <text x="720" y="716" text-anchor="middle" class="box-title">Resource scheduler + memory planner</text>
  <text x="720" y="740" text-anchor="middle" class="box-sub">placement · ordering · dependencies · synchronization · resource occupancy · allocation/reuse</text>
  <path d="M720 368 L720 552" class="binding"/>
  <path d="M720 624 L720 686" class="binding"/>

  <rect x="420" y="800" width="600" height="90" rx="18" fill="#E7F7F1" stroke="#1B9A6C" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="720" y="832" text-anchor="middle" class="box-title">ConcretePlanIR · authoritative execution-plan envelope</text>
  <text x="720" y="856" text-anchor="middle" class="box-sub">common coordination core · typed target extension · placement · buffers · synchronization</text>
  <text x="720" y="878" text-anchor="middle" class="box-sub">执行正确性来自 dependency readiness—not predicted timestamps</text>
  <path d="M720 762 L720 800" class="product"/>

  <rect x="52" y="912" width="590" height="74" rx="16" fill="#EAF3FF" stroke="#2D7FF9" filter="url(#shadow)"/>
  <text x="347" y="941" text-anchor="middle" class="box-title">Simulation branch / 仿真分支</text>
  <text x="347" y="965" text-anchor="middle" class="box-sub">TimingProjection → SimulationTraceIR → TimelineBundle / report</text>
  <rect x="798" y="912" width="590" height="74" rx="16" fill="#E7F7F1" stroke="#1B9A6C" filter="url(#shadow)"/>
  <text x="1093" y="941" text-anchor="middle" class="box-title">Program branch / 硬件 program 分支</text>
  <text x="1093" y="965" text-anchor="middle" class="box-sub">MachineIR → target verifier → ProgramArtifact → Runtime observation</text>
  <path d="M604 890 L347 912" class="derived"/>
  <path d="M836 890 L1093 912" class="product"/>

  <path d="M1309 986 C1392 986 1410 560 1309 518" class="feedback"/>
  <rect x="1134" y="772" width="254" height="56" rx="14" fill="#F4F0FF" stroke="#A79BEA"/>
  <text x="1261" y="795" text-anchor="middle" class="pill" fill="#5B46D6">Observation → CalibrationRevision</text>
  <text x="1261" y="815" text-anchor="middle" class="small">new evidence; semantic IR unchanged</text>
</svg>
