<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Blueprinting inference planning and serving simulation boundary</title>
  <desc id="desc">A shared model and mapping are specialized into independently verifiable prefill and decode phase plans. Blueprinting costs those plans independently, while Vidur is consulted only by a post-hoc baseline comparison. Static request composition is implemented, and arrivals, batching and scheduling belong to a future discrete-event serving simulator.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526075"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F7FFF"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.section{font-size:15px;font-weight:700;letter-spacing:.6px}.box-title{font-size:18px;font-weight:650}.body{font-size:13px;fill:#334155}.micro{font-size:12px;fill:#64748B}.panel{fill:#FFF;stroke:#D9E1EC;stroke-width:1.2}.semantic{fill:#E4F7FA;stroke:#22A6BA;stroke-width:1.3}.phase{fill:#E8F2FF;stroke:#2F7FFF;stroke-width:1.3}.evidence{fill:#FFF8DB;stroke:#E5A100;stroke-width:1.3}.product{fill:#E6F7F1;stroke:#18A16F;stroke-width:1.3}.future{fill:#F1EDFF;stroke:#8A6BEF;stroke-width:1.3;stroke-dasharray:7 5}.flow{fill:none;stroke:#526075;stroke-width:2.1;marker-end:url(#arrow)}.blueflow{fill:none;stroke:#2F7FFF;stroke-width:2.2;marker-end:url(#blue)}
    </style>
  </defs>
  <rect width="1440" height="820" fill="#F5F7FB"/>
  <text x="52" y="58" class="title">Inference Planning Path · 推理规划路径</text>
  <text x="52" y="86" class="subtitle">One semantic source, independent costing, external baseline comparison, and an explicit serving-simulation boundary</text>

  <rect x="36" y="118" width="300" height="590" rx="22" class="panel"/>
  <rect x="360" y="118" width="660" height="590" rx="22" class="panel"/>
  <rect x="1044" y="118" width="360" height="590" rx="22" class="panel"/>
  <text x="62" y="153" class="section" fill="#168A61">SHARED SEMANTICS</text>
  <text x="386" y="153" class="section" fill="#2F7FFF">PHASE SPECIALIZATION &amp; COST</text>
  <text x="1070" y="153" class="section" fill="#7657E8">COMPOSITION LAYERS</text>

  <rect x="66" y="184" width="240" height="92" rx="15" class="semantic"/>
  <text x="186" y="218" text-anchor="middle" class="box-title">Model + Mapping</text>
  <text x="186" y="244" text-anchor="middle" class="body">dimensions · TP · PP · replicas</text>
  <text x="186" y="264" text-anchor="middle" class="micro">request shape is not model structure</text>
  <path d="M186 276V314" class="flow"/>
  <rect x="66" y="314" width="240" height="100" rx="15" class="semantic" filter="url(#shadow)"/>
  <text x="186" y="350" text-anchor="middle" class="box-title">ModelIR</text>
  <text x="186" y="376" text-anchor="middle" class="body">decoder_inference + KV state effect</text>
  <text x="186" y="397" text-anchor="middle" class="micro">phase-neutral · hardware-neutral</text>
  <path d="M306 364C348 364 346 252 402 252" class="blueflow"/>
  <path d="M306 364C348 364 346 512 402 512" class="blueflow"/>

  <rect x="402" y="184" width="278" height="136" rx="16" class="phase"/>
  <text x="541" y="218" text-anchor="middle" class="box-title">Prefill Binding</text>
  <text x="541" y="244" text-anchor="middle" class="body">query = context = prompt tokens</text>
  <text x="541" y="268" text-anchor="middle" class="micro">ModelIR → DistributedTaskIR</text>
  <text x="541" y="289" text-anchor="middle" class="micro">→ PortablePlanIR + KV capacity</text>
  <rect x="402" y="444" width="278" height="136" rx="16" class="phase"/>
  <text x="541" y="478" text-anchor="middle" class="box-title">Decode Binding</text>
  <text x="541" y="504" text-anchor="middle" class="body">query = 1 · explicit context length</text>
  <text x="541" y="528" text-anchor="middle" class="micro">same verified representation boundaries</text>
  <text x="541" y="549" text-anchor="middle" class="micro">one plan point per context</text>

  <rect x="724" y="224" width="250" height="116" rx="15" class="evidence"/>
  <text x="849" y="258" text-anchor="middle" class="box-title">Blueprinting Cost Model</text>
  <text x="849" y="284" text-anchor="middle" class="body">HardwareProfile · internal cost provider</text>
  <text x="849" y="307" text-anchor="middle" class="micro">no comparison-oracle input</text>
  <rect x="724" y="424" width="250" height="116" rx="15" class="evidence"/>
  <text x="849" y="458" text-anchor="middle" class="box-title">Phase Cost View</text>
  <text x="849" y="484" text-anchor="middle" class="body">component latency · TP / PP transfer</text>
  <text x="849" y="507" text-anchor="middle" class="micro">weights · KV · working memory</text>
  <path d="M680 252H724" class="flow"/><path d="M680 512C706 512 702 320 724 320" class="flow"/><path d="M849 340V424" class="flow"/>

  <rect x="724" y="580" width="250" height="82" rx="15" class="future"/>
  <text x="849" y="612" text-anchor="middle" class="box-title">Vidur Raw Profile Report</text>
  <text x="849" y="638" text-anchor="middle" class="micro">post-hoc coverage · error · provenance</text>
  <path d="M849 540V580" class="flow"/>

  <rect x="1080" y="188" width="288" height="168" rx="16" class="product" filter="url(#shadow)"/>
  <text x="1224" y="224" text-anchor="middle" class="box-title">Static Request Composition</text>
  <text x="1224" y="252" text-anchor="middle" class="body">prefill emits token 1</text>
  <text x="1224" y="277" text-anchor="middle" class="body">decode contexts S+1 … S+O−1</text>
  <text x="1224" y="306" text-anchor="middle" class="micro">prefill · decode steps · model execution</text>
  <text x="1224" y="329" text-anchor="middle" class="micro">implemented · no queueing claim</text>
  <path d="M974 482C1030 482 1026 272 1080 272" class="flow"/>

  <rect x="1080" y="438" width="288" height="190" rx="16" class="future"/>
  <text x="1224" y="474" text-anchor="middle" class="box-title">Serving DES (next layer)</text>
  <text x="1224" y="502" text-anchor="middle" class="body">arrival trace · routing · queues</text>
  <text x="1224" y="528" text-anchor="middle" class="body">continuous batching · chunked prefill</text>
  <text x="1224" y="554" text-anchor="middle" class="body">scheduler / CPU overhead · SLO tails</text>
  <text x="1224" y="584" text-anchor="middle" class="micro">consumes the same phase cost view</text>
  <text x="1224" y="607" text-anchor="middle" class="micro">does not redefine operator semantics</text>

  <text x="52" y="758" class="body">Invariant: Blueprinting costs its own lowered plan; a comparison baseline can measure error but cannot change that plan or estimate.</text>
  <text x="52" y="783" class="micro">不变量：Blueprinting 独立估算自己的 lowered plan；baseline 只能度量误差，不能修改 plan 或 estimate。</text>
</svg>
