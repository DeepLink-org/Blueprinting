name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_i18n.py"
      - "scripts/check_rendered_code_docs.py"
      - "src/blueprinting/**"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_i18n.py"
      - "scripts/check_rendered_code_docs.py"
      - "src/blueprinting/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Do not interrupt an in-flight Pages deployment. A newer run will remain
  # pending and publish after the active deployment completes.
  cancel-in-progress: false

jobs:
  build:
    name: Build bilingual documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install documentation dependencies
        run: uv sync --locked --no-dev --extra docs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Check bilingual source contract
        run: uv run --no-dev --extra docs python scripts/check_docs_i18n.py

      - name: Build documentation
        run: uv run --no-dev --extra docs mkdocs build --strict

      - name: Check rendered code documentation
        run: uv run --no-dev --extra docs python scripts/check_rendered_code_docs.py

      - name: Upload documentation preview artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: blueprinting-docs-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
