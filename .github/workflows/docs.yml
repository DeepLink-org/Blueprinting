name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_i18n.py"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_i18n.py"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bilingual documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install documentation dependencies
        run: uv sync --locked --no-dev --extra docs

      - name: Check bilingual source contract
        run: uv run --no-dev --extra docs python scripts/check_docs_i18n.py

      - name: Build documentation
        run: uv run --no-dev --extra docs mkdocs build --strict

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: blueprinting-docs-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14
