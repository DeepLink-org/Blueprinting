name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-regression:
    name: Training calibration and inference drift regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run pinned baseline regression gates
        run: uv run pytest -m baseline_regression tests/regression

  test-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint supported architecture boundary
        run: >-
          uv run ruff check
          src/blueprinting/__init__.py
          src/blueprinting/__main__.py
          src/blueprinting/cli
          src/blueprinting/schema
          src/blueprinting/workload
          src/blueprinting/mapping
          src/blueprinting/system
          src/blueprinting/synthesizer
          src/blueprinting/analysis
          src/blueprinting/validation
          src/blueprinting/application
          src/blueprinting/workbench
          tests/synthesizer
          tests/analysis
          tests/application
          tests/regression
          tests/workbench

      - name: Run tests
        run: uv run pytest

  package-contract:
    name: Base wheel contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel contents and size
        run: uv run python scripts/check_wheel_contract.py dist/*.whl
